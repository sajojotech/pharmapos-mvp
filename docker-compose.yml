services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmapos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmapos
    ports:
      - "5432:5432"
    volumes:
      - pharmapos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmapos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pharmapos_postgres_data:
    name: pharmapos_postgres_data
